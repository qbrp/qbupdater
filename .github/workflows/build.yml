name: Build with jpackage

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build client
        run: ./gradlew :client:clean :client:jpackage

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: qbupdater-${{ runner.os }}
          path: |
            client/build/jpackage/**/*.exe
            client/build/jpackage/**/*.deb
            client/build/jpackage/**/*.dmg
            client/build/jpackage/**/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build Getdown files
        run: ./gradlew :client:getdownDistribution

      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          path: release-packages

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            client/build/getdown/getdown.txt
            client/build/getdown/digest.txt
            client/build/getdown/digest2.txt
            client/build/getdown/qbupdater.jar
            release-packages/**/*.exe
            release-packages/**/*.deb
            release-packages/**/*.dmg
            release-packages/**/*.pkg
